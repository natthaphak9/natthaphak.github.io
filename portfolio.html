<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | Natthaphak</title>


    <style>

        /* =========================
           ตั้งค่าพื้นฐาน
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }


        body {
            background: #050505;
            color: #ffffff;
            padding: 30px 20px;
        }


        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }


        /* =========================
           ส่วนหัว
        ========================= */

        .header {
            text-align: center;
            padding: 50px 20px;
        }


        .header h1 {
            font-size: 45px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }


        .header p {
            color: #999999;
            font-size: 18px;
            line-height: 1.8;
        }


        /* =========================
           เส้นแบ่ง
        ========================= */

        .line {
            width: 100%;
            height: 1px;
            background: #333333;
            margin: 25px 0 55px;
        }


        /* =========================
           หัวข้อ
        ========================= */

        .section-title {
            font-size: 30px;
            margin-bottom: 12px;
        }


        .section-description {
            color: #999999;
            line-height: 1.8;
            margin-bottom: 30px;
        }


        /* =========================
           เกียรติบัตร
        ========================= */

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }


        .gallery-item {
            background: #111111;
            border: 1px solid #292929;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }


        .gallery-item:hover {
            transform: translateY(-6px);
            border-color: #777777;
            box-shadow: 0 10px 30px rgba(255,255,255,0.08);
        }


        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }


        .caption {
            text-align: center;
            padding: 15px;
            color: #cccccc;
        }


        /* =========================
           รูปภาพรับรางวัล
        ========================= */

        .award-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }


        .award-item {
            background: #111111;
            border: 1px solid #292929;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }


        .award-item:hover {
            transform: translateY(-6px);
            border-color: #777777;
            box-shadow: 0 10px 30px rgba(255,255,255,0.08);
        }


        .award-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }


        /* =========================
           ความชอบด้านคอม
        ========================= */

        .about-box {
            background: #111111;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
            transition: 0.3s;
        }


        .about-box:hover {
            border-color: #666666;
            transform: translateY(-3px);
        }


        .about-box p {
            color: #bbbbbb;
            line-height: 2;
            font-size: 17px;
            margin-bottom: 18px;
        }


        .about-box p:last-child {
            margin-bottom: 0;
        }


        /* =========================
           มหาวิทยาลัย
        ========================= */

        .university {
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            color: #ffffff;
            transition: 0.3s;
        }


        .university:hover {
            background: #222222;
            border-color: #777777;
            transform: translateX(5px);
        }


        /* =========================
           ปุ่มกลับหน้าแรก
        ========================= */

        .back {
            text-align: center;
            margin: 60px 0 30px;
        }


        .btn {
            display: inline-block;
            padding: 15px 32px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }


        .btn:hover {
            background: #cccccc;
            transform: scale(1.05);
        }


        /* =========================
           รูปขยายเมื่อกด
        ========================= */

        .gallery-item img:hover,
        .award-item img:hover {
            opacity: 0.85;
        }


        /* =========================
           มือถือ
        ========================= */

        @media (max-width: 800px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .award-gallery {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 550px) {

            body {
                padding: 15px;
            }


            .header {
                padding: 35px 10px;
            }


            .header h1 {
                font-size: 30px;
            }


            .header p {
                font-size: 16px;
            }


            .section-title {
                font-size: 25px;
            }


            .gallery {
                grid-template-columns: 1fr;
            }


            .award-gallery {
                grid-template-columns: 1fr;
            }


            .gallery-item img,
            .award-item img {
                height: auto;
                max-height: 600px;
            }


            .about-box {
                padding: 22px;
            }


            .about-box p {
                font-size: 16px;
            }

        }

    </style>

</head>
